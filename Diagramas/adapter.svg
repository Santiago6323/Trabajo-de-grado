<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="920" height="360" fill="#ffffff"/>

  <!-- Marco -->
  <rect x="6" y="6" width="908" height="258" rx="10" fill="#ffffff" stroke="#1f6b4f" stroke-width="6"/>
  <text x="28" y="44" font-size="22" fill="#1f6b4f">Interior del adaptador</text>
  <text x="900" y="44" font-size="19" fill="#888" text-anchor="end">cuello de botella · inicialización próxima a la identidad</text>

  <!-- Flujo principal -->
  <line x1="90" y1="128" x2="178" y2="128" stroke="#555" stroke-width="2.5" marker-end="url(#arr)"/>
  <circle cx="128" cy="128" r="4.5" fill="#555"/>
  <line x1="262" y1="128" x2="306" y2="128" stroke="#555" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="372" y1="128" x2="406" y2="128" stroke="#555" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="490" y1="128" x2="534" y2="128" stroke="#555" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="582" y1="128" x2="660" y2="128" stroke="#555" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Conexión residual -->
  <path d="M128,128 C140,30 545,30 560,100" fill="none" stroke="#555" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- down (d→m) -->
  <polygon points="190,68 254,68 270,52 206,52" fill="#3fa37a"/>
  <polygon points="254,68 270,52 270,172 254,188" fill="#1f6b4f"/>
  <rect x="190" y="68" width="64" height="120" fill="#2e8b66"/>
  <text x="222" y="216" font-size="19" fill="#2e8b66" text-anchor="middle">down</text>
  <text x="222" y="240" font-size="17" fill="#888" text-anchor="middle">d→m</text>

  <!-- GELU -->
  <polygon points="316,72 360,72 372,60 328,60" fill="#eeeeee" stroke="#777" stroke-width="1.5"/>
  <polygon points="360,72 372,60 372,168 360,180" fill="#a8a8a8" stroke="#777" stroke-width="1.5"/>
  <rect x="316" y="72" width="44" height="108" fill="#d4d4d4" stroke="#777" stroke-width="1.5"/>
  <text x="340" y="216" font-size="19" fill="#333" text-anchor="middle">GELU</text>

  <!-- up (m→d) -->
  <polygon points="416,68 480,68 496,52 432,52" fill="#9ad8b6"/>
  <polygon points="480,68 496,52 496,172 480,188" fill="#4fae80"/>
  <rect x="416" y="68" width="64" height="120" fill="#6cc497"/>
  <text x="448" y="216" font-size="19" fill="#2e8b66" text-anchor="middle">up</text>
  <text x="448" y="240" font-size="17" fill="#888" text-anchor="middle">m→d</text>

  <!-- Suma residual -->
  <circle cx="560" cy="128" r="18" fill="#ffffff" stroke="#222" stroke-width="5"/>
  <line x1="550" y1="128" x2="570" y2="128" stroke="#222" stroke-width="4"/>
  <line x1="560" y1="118" x2="560" y2="138" stroke="#222" stroke-width="4"/>

  <!-- Leyenda -->
  <rect x="10" y="304" width="26" height="26" fill="#2e8b66" stroke="#1f6b4f" stroke-width="2"/>
  <rect x="44" y="304" width="26" height="26" fill="#6cc497" stroke="#4fae80" stroke-width="2"/>
  <text x="86" y="324" font-size="19" fill="#333">Proyección lineal (entrenable)</text>

  <rect x="430" y="304" width="26" height="26" fill="#d4d4d4" stroke="#555" stroke-width="2.5"/>
  <text x="470" y="324" font-size="19" fill="#333">Activación GELU</text>

  <circle cx="738" cy="317" r="13" fill="#ffffff" stroke="#222" stroke-width="4"/>
  <line x1="731" y1="317" x2="745" y2="317" stroke="#222" stroke-width="3"/>
  <line x1="738" y1="310" x2="738" y2="324" stroke="#222" stroke-width="3"/>
  <text x="764" y="324" font-size="19" fill="#333">Suma residual</text>
</svg>
